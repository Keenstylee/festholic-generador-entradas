[theme]
base = "light"
primaryColor = "#FF2E9F"
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1F"
linkColor = "#007C91"
borderColor = "#DADAE0"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "12px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 700, 650, 650, 650]
linkUnderline = false
redColor = "#FF5B72"
orangeColor = "#FF7043"
yellowColor = "#F2C94C"
greenColor = "#51D98A"
blueColor = "#25C9E8"
violetColor = "#B889FF"
grayColor = "#8A8A96"
chartCategoricalColors = ["#FF2E9F", "#25C9E8", "#FF7043", "#51D98A", "#B889FF", "#F2C94C"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7"
textColor = "#1D1D1F"
borderColor = "#E2E2E7"
primaryColor = "#007C91"

[server]
headless = true
