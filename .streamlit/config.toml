[theme]
base = "dark"
primaryColor = "#FF2E9F"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#15151A"
textColor = "#F7F7FA"
linkColor = "#25C9E8"
borderColor = "#29292F"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "12px"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "19px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 700, 650, 650, 650]
linkUnderline = false
redColor = "#FF5B72"
orangeColor = "#FF7043"
yellowColor = "#F2C94C"
greenColor = "#51D98A"
blueColor = "#25C9E8"
violetColor = "#B889FF"
grayColor = "#8A8A96"
chartCategoricalColors = ["#FF2E9F", "#25C9E8", "#FF7043", "#51D98A", "#B889FF", "#F2C94C"]

[theme.sidebar]
backgroundColor = "#0D0D11"
secondaryBackgroundColor = "#15151A"
textColor = "#F7F7FA"
borderColor = "#24242A"
primaryColor = "#25C9E8"

[server]
headless = true
